# TEMPORARY troubleshooting override: exposes the Conductor UI/API on 127.0.0.1 only (default port 18090).
#
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.conductor-ui.yml up -d conductor
#   -> http://127.0.0.1:18090  (UI at /, REST at /api, health at /health); reach it from your workstation with an SSH tunnel:
#      ssh -L 18090:127.0.0.1:18090 admin@crm-host
#
# Remove it again when done (the normal stack keeps Conductor on the internal `backend` network only):
#   docker compose -f deploy/docker-compose.prod.yml up -d conductor
#
# Conductor has no authentication of its own. While this override is active the container is also attached to the non-internal
# `frontend` network (Docker cannot publish a port of a container that lives only on an internal network).
services:
  conductor:
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:${CONDUCTOR_UI_PORT:-18090}:8080"

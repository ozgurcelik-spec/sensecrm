name: ${COMPOSE_PROJECT_NAME:-crm-prod}

# CRM - production stack for an in-house / own-datacenter deployment (Docker Compose v2).
#
#   cp deploy/.env.example deploy/.env      # or run deploy/generate-secrets.ps1 (Windows) / deploy/generate-secrets.sh (Linux)
#   docker compose -f deploy/docker-compose.prod.yml build            # or pull the images from your registry (CRM_REGISTRY / CRM_VERSION)
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Order on `up`: postgres -> db-init (roles + databases, idempotent) -> migrator (must exit 0) -> api, worker -> web.
# Network model: only `web` publishes a host port (default 127.0.0.1:8080), and it sits on `frontend` (the published-port network)
# plus `edge`. `edge` (web <-> api only) and `backend` (postgres, conductor, redis, api, worker, jobs) are both `internal: true`: they
# have NO route to the outside, so api/worker/postgres/conductor cannot call out (data residency), and `web` cannot reach the
# database, Conductor, Redis or the worker at all (it shares a network with `api` only). TLS is terminated by an external reverse
# proxy / load balancer (deploy/tls/*.example).
# Every secret comes from deploy/.env (interpolated with `:?` = the stack refuses to start when one is missing) or from files under
# deploy/secrets (Docker secrets, mounted at /run/secrets). There are no default passwords in this file.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env (run deploy/generate-secrets.ps1)}
      POSTGRES_DB: postgres
      TZ: Europe/Istanbul
    # Tuned basics for a dedicated 2 GB container; scale shared_buffers (~25% of RAM) and effective_cache_size (~60%) with PG_MEM_LIMIT.
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-1000}
      - -c
      - log_timezone=Europe/Istanbul
      - -c
      - timezone=Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [backend]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-2g}
          cpus: "${PG_CPUS:-2.0}"

  # Roles, databases and privileges (idempotent, runs on every `up`). See deploy/postgres/init-roles.sql.
  db-init:
    image: postgres:17.11-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      CRM_OWNER_PASSWORD: ${CRM_OWNER_PASSWORD:?set CRM_OWNER_PASSWORD in deploy/.env}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?set CRM_APP_PASSWORD in deploy/.env}
      CONDUCTOR_DB_PASSWORD: ${CONDUCTOR_DB_PASSWORD:?set CONDUCTOR_DB_PASSWORD in deploy/.env}
    volumes:
      - ./postgres/init-roles.sql:/init-roles.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql -X -v ON_ERROR_STOP=1 -d postgres
        -v owner_pw="$$CRM_OWNER_PASSWORD" -v app_pw="$$CRM_APP_PASSWORD" -v conductor_pw="$$CONDUCTOR_DB_PASSWORD"
        -f /init-roles.sql
    networks: [backend]
    logging: *logging

  # Workflow engine (Conductor OSS, K9). State lives in its own database "conductor" with its own role; no Redis/Elasticsearch.
  # The UI/API are NOT published; reach them with `docker compose exec` or an SSH tunnel (see the runbook).
  conductor:
    image: conductoross/conductor:3.32.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      CONFIG_PROP: config-postgres.properties
      CONDUCTOR_DB_USER: conductor
      CONDUCTOR_DB_PASSWORD: ${CONDUCTOR_DB_PASSWORD:?set CONDUCTOR_DB_PASSWORD in deploy/.env}
      JAVA_OPTS: ${CONDUCTOR_JAVA_OPTS:--Xms256m -Xmx768m}
    volumes:
      - ../infra/conductor/config-postgres.properties:/app/config/config-postgres.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [backend]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${CONDUCTOR_MEM_LIMIT:-1536m}
          cpus: "${CONDUCTOR_CPUS:-1.5}"

  # Object storage for file attachments (M8C, K19): MinIO community edition (AGPLv3, used unmodified as an internal service). The image tag is pinned
  # (never `latest`; see the runbook "Object storage" for the licence/maintenance note and how to switch to another S3-compatible server).
  # NOT published: no `ports`, backend network only (internal). The browser console is off (MINIO_BROWSER=off); administer with
  # `docker compose exec minio-init mc ...` style one-off containers or `docker compose run --rm --entrypoint sh minio-init`.
  # Objects are encrypted at rest with SSE-S3 using a static KMS key from the Docker secret minio_kms_key (no external KES/network call).
  # BACK THE KEY UP TOGETHER WITH THE DATA: a data backup without the key is unreadable.
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio_kms_key
      MINIO_BROWSER: "off"
      TZ: Europe/Istanbul
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_kms_key
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEM_LIMIT:-1g}

  # Run-once, idempotent (every `up`): creates the bucket, enables default SSE-S3, and creates the application account limited to THIS bucket.
  # The application never holds the root credentials. See deploy/minio/init.sh.
  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${FILES_BUCKET:-crm-files}
      MINIO_ENCRYPTION: required
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_APP_ACCESS_KEY_FILE: /run/secrets/minio_app_access_key
      MINIO_APP_SECRET_KEY_FILE: /run/secrets/minio_app_secret_key
    volumes:
      - ./minio/init.sh:/init.sh:ro
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_app_access_key
      - minio_app_secret_key
    networks: [backend]
    logging: *logging

  # Run-once job: applies every module's EF migrations as the owner role. api and worker start only after it exits 0.
  # First platform admin:  docker compose -f deploy/docker-compose.prod.yml run --rm --user root migrator create-platform-admin
  migrator:
    image: ${CRM_REGISTRY:-}crm-migrator:${CRM_VERSION:-latest}
    build:
      context: ..
      dockerfile: src/Sense.Crm.Migrator/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: ["migrate"]
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=crm;Username=crm_owner;Password=${CRM_OWNER_PASSWORD:?set CRM_OWNER_PASSWORD in deploy/.env}
      # M8C: erase-deleted-tenants / files-reconcile need the object store (application account from the Docker secrets below).
      Files__Storage__Endpoint: http://minio:9000
      Files__Storage__Bucket: ${FILES_BUCKET:-crm-files}
      # create-platform-admin (the password is read from the Docker secret file, never from the environment or logs)
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-}
      PLATFORM_ORG_NAME: ${PLATFORM_ORG_NAME:-}
      PLATFORM_ADMIN_PASSWORD_FILE: /run/secrets/platform_admin_password
    # A writable bind mount (NOT a `secrets:` entry, which is always mounted read-only): after a successful create-platform-admin the
    # Migrator empties this file. The host file is 0600 (owner only), so the bootstrap must run as root inside the container:
    #   docker compose -f deploy/docker-compose.prod.yml run --rm --user root migrator create-platform-admin
    # The regular `migrate` run (every `up`, uid 1654) cannot read the file at all.
    volumes:
      - type: bind
        source: ${PLATFORM_ADMIN_PASSWORD_FILE:-./secrets/platform-admin-password}
        target: /run/secrets/platform_admin_password
        bind:
          create_host_path: false
    secrets:
      - source: integrations_encryption_key
        target: Integrations__Encryption__Keys__k1
      - source: minio_app_access_key
        target: Files__Storage__AccessKey
      - source: minio_app_secret_key
        target: Files__Storage__SecretKey
    networks: [backend]
    logging: *logging

  api:
    image: ${CRM_REGISTRY:-}crm-api:${CRM_VERSION:-latest}
    build:
      context: ..
      dockerfile: src/Sense.Crm.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      conductor:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # M8C file attachments: S3-compatible object storage on the backend network (Production requires provider s3 + encryption required).
      Files__Storage__Endpoint: http://minio:9000
      Files__Storage__Bucket: ${FILES_BUCKET:-crm-files}
      # Upload temp files live on tmpfs (below): sized for concurrent uploads x Files:Upload:MaxFileMb.
      Files__Upload__TempDirectory: /tmp
      # Least-privilege application role (DML only); DDL happens in the migrator with crm_owner.
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=crm;Username=crm_app;Password=${CRM_APP_PASSWORD:?set CRM_APP_PASSWORD in deploy/.env}
      ConnectionStrings__Redis: ${REDIS_CONNECTION:-}
      # JWT signing key comes from the Docker secret below (/run/secrets/Auth__SigningKeyPem -> Auth:SigningKeyPem).
      Conductor__BaseUrl: http://conductor:8080
      # open | disabled. Disabled = organizations are created by the platform admin (POST /api/v1/platform/organizations).
      Registration__Mode: ${REGISTRATION_MODE:-disabled}
      # Public host name(s) the SPA is served under (';' separated); localhost is needed for the container health check.
      AllowedHosts: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in deploy/.env (public host name, e.g. crm.company.local)};localhost
      # The web container's nginx is the only client of the api: trust its X-Forwarded-* (it reaches the api over the `edge` network).
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownNetworks__0: ${EDGE_SUBNET:-10.213.80.0/24}
      Docs__Enabled: ${API_DOCS_ENABLED:-false}
      TZ: Europe/Istanbul
    secrets:
      - source: jwt_signing_key
        target: Auth__SigningKeyPem
      - source: integrations_encryption_key
        target: Integrations__Encryption__Keys__k1
      - source: minio_app_access_key
        target: Files__Storage__AccessKey
      - source: minio_app_secret_key
        target: Files__Storage__SecretKey
    tmpfs:
      - /tmp:size=${API_TMP_SIZE:-512m},mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [edge, backend]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-1g}
          cpus: "${API_CPUS:-2.0}"

  # Outbox processor + Conductor task workers + execution status sync. Keep 1 replica until the workflow task handlers are load-tested.
  worker:
    image: ${CRM_REGISTRY:-}crm-worker:${CRM_VERSION:-latest}
    build:
      context: ..
      dockerfile: src/Sense.Crm.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      conductor:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=crm;Username=crm_app;Password=${CRM_APP_PASSWORD:?set CRM_APP_PASSWORD in deploy/.env}
      ConnectionStrings__Redis: ${REDIS_CONNECTION:-}
      Conductor__BaseUrl: http://conductor:8080
      # M8C: file lifecycle jobs (purge, reconciliation) and the KVKK object erasure need the object store.
      Files__Storage__Endpoint: http://minio:9000
      Files__Storage__Bucket: ${FILES_BUCKET:-crm-files}
      TZ: Europe/Istanbul
    secrets:
      - source: integrations_encryption_key
        target: Integrations__Encryption__Keys__k1
      - source: minio_app_access_key
        target: Files__Storage__AccessKey
      - source: minio_app_secret_key
        target: Files__Storage__SecretKey
    networks: [backend]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-768m}
          cpus: "${WORKER_CPUS:-1.0}"

  # SPA + reverse proxy for /api. The only published port. Put your TLS terminator (Caddy/nginx/HAProxy/LB) in front of it.
  web:
    image: ${CRM_REGISTRY:-}crm-web:${CRM_VERSION:-latest}
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:8080
      # Address/network of the external proxy/LB whose X-Forwarded-For is trusted for the client address (rate limits, audit IPs).
      # Default = loopback only, i.e. NOTHING is trusted: a client can never spoof its address. Set it explicitly when a proxy/LB is in
      # front (see deploy/.env.example); never to the frontend subnet/gateway while WEB_BIND is not 127.0.0.1.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks: [frontend, edge]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-128m}
          cpus: "${WEB_CPUS:-0.5}"

  # Optional distributed cache (HybridCache L2) for running more than one api replica: `--profile redis` (or COMPOSE_PROFILES=redis)
  # plus REDIS_CONNECTION=redis:6379,password=<REDIS_PASSWORD> in deploy/.env. A single api replica does not need it.
  redis:
    image: redis:7.4.11-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}", "--appendonly", "no", "--save", "", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-384m}

networks:
  # No route to the outside: postgres, conductor, redis, api, worker and the jobs cannot initiate outbound connections.
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-10.213.77.0/24}
  # Only for the published web port (Docker cannot publish a port from an internal network). Only `web` is attached to it.
  frontend:
    ipam:
      config:
        - subnet: ${FRONTEND_SUBNET:-10.213.78.0/24}
  # web <-> api link: internal (no route out, so api gains no outbound path) and shared by NO other service.
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.213.80.0/24}

volumes:
  pgdata:
  miniodata:

secrets:
  # Object storage (M8C). Generated by deploy/generate-secrets.*. minio_kms_key is the static KMS key ("crm-files-key:<base64 of 32 random bytes>")
  # that encrypts every object at rest: BACK IT UP with the object data (losing it = losing the files; it cannot be rotated in the first release).
  minio_root_user:
    file: ${MINIO_ROOT_USER_FILE:-./secrets/minio-root-user}
  minio_root_password:
    file: ${MINIO_ROOT_PASSWORD_FILE:-./secrets/minio-root-password}
  minio_kms_key:
    file: ${MINIO_KMS_KEY_FILE:-./secrets/minio-kms-key}
  # Application account limited to the crm-files bucket (what api/worker/migrator use; never the root account).
  minio_app_access_key:
    file: ${MINIO_APP_ACCESS_KEY_FILE:-./secrets/minio-app-access-key}
  minio_app_secret_key:
    file: ${MINIO_APP_SECRET_KEY_FILE:-./secrets/minio-app-secret-key}
  # RSA private key (PEM) that signs the JWT access tokens. Generated by deploy/generate-secrets.*; back it up with the database.
  jwt_signing_key:
    file: ${JWT_SIGNING_KEY_FILE:-./secrets/jwt-signing-key.pem}
  # (The first platform admin's password file is a writable bind mount on the migrator service, see there.)
  # AES-256 key (base64, 32 bytes) that encrypts webhook signing secrets at rest (M8B). REQUIRED: api, worker and migrator refuse to start without it.
  # Back it up SEPARATELY from the database backup; losing it makes stored webhook secrets unreadable (rotate them). Rotation: runbook section 4.
  integrations_encryption_key:
    file: ${INTEGRATIONS_KEY_FILE:-./secrets/integrations-encryption-key}

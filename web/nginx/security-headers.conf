# Included by every location: nginx does not inherit add_header into a location that defines its own.
# CSP: everything from the same origin. style-src needs 'unsafe-inline' because Mantine injects <style> at runtime.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS only when the request reached the external TLS terminator over HTTPS ($hsts is empty otherwise, and nginx omits empty headers).
add_header Strict-Transport-Security $hsts always;

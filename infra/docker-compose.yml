name: crm

# Port kalıbı: host'a yayınlanan her port "standart port + 10000" (Postgres 5432 -> 15432, Redis 6379 -> 16379).
# Geliştirici makinesindeki yerel Postgres/Redis ile çakışmayı önler. Container-içi portlar değişmez; .env ile ezilebilir.
# Bu dosyadaki parolalar yalnızca yerel geliştirme içindir. Yayınlanan portlar yalnız 127.0.0.1'e bağlıdır (ağdaki başka makineler erişemez);
# üretim için deploy/docker-compose.prod.yml kullanılır.
#
# Başlatma:  docker compose -f infra/docker-compose.yml up -d
# Şema:      dotnet run --project src/Sense.Crm.Migrator
# API:       dotnet run --project src/Sense.Crm.Api          (http://localhost:5080)
# Worker:    dotnet run --project src/Sense.Crm.Worker
#
# Conductor OSS (Milestone 4 workflow motoru): http://localhost:18090 (API: /api, UI: /, sağlık: /health)
#   POSTGRES_PORT=15433 docker compose -f infra/docker-compose.yml up -d conductor
# NOT: POSTGRES_PORT bu makinede 15433'tür (15432 başka projeye aittir); mevcut postgres konteynerini yeniden
# yaratmamak için yalnız conductor servisini `up -d --no-deps conductor-db-init conductor` ile başlatabilirsiniz.

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - crm_pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redis isteğe bağlıdır: ConnectionStrings:Redis verilirse HybridCache'in L2 katmanı olur, verilmezse yalnız bellek içi önbellek çalışır.
  redis:
    image: redis:7.4.11-alpine
    container_name: crm-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Conductor OSS (workflow motoru, K9) ---------------------------------------------------------
  # Neden bu kurulum: conductoross/conductor imajı sunucu + UI'yı tek konteynerde taşır; varsayılanı gömülü
  # SQLite'tır ancak eşzamanlı poll/güncelleme yükü ve yeniden başlatma dayanıklılığı için crm-postgres'te ayrı
  # bir "conductor" veritabanı kullanılır (Redis ve Elasticsearch GEREKMEZ: db/queue/indexing = postgres).
  # Sürüm sabitlenir (latest yok): 3.32.4 = 2026-09 itibarıyla son kararlı sürüm. Yapılandırma: conductor/config-postgres.properties.
  # Veritabanı yoksa tek seferlik conductor-db-init oluşturur (postgres init.sql yalnız ilk kurulumda çalıştığı için
  # mevcut veri hacimlerinde de çalışır; idempotenttir).
  conductor-db-init:
    image: postgres:17.11-alpine
    container_name: crm-conductor-db-init
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-crm}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm} -tAc "SELECT 1 FROM pg_database WHERE datname='conductor'" | grep -q 1           || psql -h postgres -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm} -c "CREATE DATABASE conductor"

  conductor:
    image: conductoross/conductor:3.32.4
    container_name: crm-conductor
    depends_on:
      conductor-db-init:
        condition: service_completed_successfully
    environment:
      CONFIG_PROP: config-postgres.properties
      CONDUCTOR_DB_USER: ${POSTGRES_USER:-crm}
      CONDUCTOR_DB_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      JAVA_OPTS: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:${CONDUCTOR_PORT:-18090}:8080"
    volumes:
      - ./conductor/config-postgres.properties:/app/config/config-postgres.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # --- Nesne deposu (dosya ekleri, M8C/K19): MinIO topluluk sürümü, yalnız yerel geliştirme ------------------------------------
  # Host portları standart + 10000 (S3 API 9000 -> 19000, konsol 9001 -> 19001), yalnız 127.0.0.1. Buradaki kimlik bilgileri YALNIZ yerel geliştirme içindir;
  # üretim deploy/docker-compose.prod.yml'dedir (port yayınlamaz, Docker secret'lar, KMS anahtarıyla sifreleme). İmaj etiketi sabittir (latest yok).
  # API'yi bu depoya bağlamak için (varsayılan geliştirme sağlayıcısı "filesystem"dir, Docker gerekmez):
  #   Files__Storage__Provider=s3  Files__Storage__Endpoint=http://localhost:19000  Files__Storage__AccessKey=crm-files-app  Files__Storage__SecretKey=crm-files-app-secret
  # Geliştirmede şifreleme kapalıdır (Files__Storage__Encryption=none varsayılanı); KMS anahtarı yalnız üretimde.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: crm-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-crmminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-crmminio-dev-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - crm_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Tek seferlik, idempotent: kova + yalnız bu kovaya izinli uygulama hesabı (deploy/minio/init.sh; üretimle aynı betik).
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: crm-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: crm-files
      MINIO_ENCRYPTION: none
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-crmminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-crmminio-dev-secret}
      MINIO_APP_ACCESS_KEY: crm-files-app
      MINIO_APP_SECRET_KEY: crm-files-app-secret
    volumes:
      - ../deploy/minio/init.sh:/init.sh:ro

volumes:
  crm_minio:
  crm_pg:

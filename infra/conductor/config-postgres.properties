# CRM için Conductor OSS yapılandırması: yalnız PostgreSQL (Redis/Elasticsearch yok).
# Kalıcılık, kuyruk ve indeksleme crm-postgres içindeki ayrı "conductor" veritabanındadır.
# Yalnızca yerel geliştirme parolası; üretimde ortam/secret ile verilir.
conductor.db.type=postgres
conductor.queue.type=postgres
conductor.indexing.enabled=true
conductor.indexing.type=postgres
# Elasticsearch'e bağlanmayı kapatır (zorunlu).
conductor.elasticsearch.version=0

spring.datasource.url=jdbc:postgresql://postgres:5432/conductor
spring.datasource.username=${CONDUCTOR_DB_USER}
spring.datasource.password=${CONDUCTOR_DB_PASSWORD}

# Örnek "kitchen-sink" workflow'u yüklenmesin.
loadSample=false

# Bekleyen HUMAN/WAIT görevleri için durum sorgulamalarını hızlandırır.
conductor.app.taskExecutionPostponeDuration=10s
